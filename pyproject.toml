[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rh-piping"
version = "0.1.0"
description = "Image piping workflow for furniture edits via AI image APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=0.5.0",
  "Pillow>=10.4.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
rh-piping = "rh_piping.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
